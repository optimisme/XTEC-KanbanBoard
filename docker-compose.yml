# Local MySQL 8 for development and automated tests. Not for production.
#   docker compose up -d        start
#   docker compose down -v      stop and delete the local data
services:
  mysql:
    image: mysql:8.4
    container_name: kanban-mysql
    environment:
      MYSQL_ROOT_PASSWORD: kanban_root_test
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - kanban-mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pkanban_root_test"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kanban-mysql-data:
